name: Release

on:
  push:
    tags:
      - 'v*'
      - '0.*'
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME="tskr-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -ldflags="-s -w" -o "${BINARY_NAME}" .
          tar -czvf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}"

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: tskr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
